<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warta — Agregator Berita Otomatis</title>
    <style>
        /* === Reset & Variabel === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --card-border: #1e1e1e;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-muted: #666666;
            --accent-color: #ff3b30;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding-bottom: 40px;
            max-width: 600px;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
        }

        /* === Header Sticky (Glassmorphism) === */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 8, 8, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .header-title p {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 59, 48, 0.12);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-color);
        }

        /* === Feed Berita === */
        .news-grid {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .news-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .news-card:active {
            transform: scale(0.98);
            border-color: #333;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 210px;
            background: #1a1a1a;
            overflow: hidden;
        }

        .news-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .news-content {
            padding: 18px;
        }

        .news-title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .news-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }

        .news-source {
            font-weight: 600;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-msg {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-title">
            <h1>Warta.</h1>
            <p>Diperbarui otomatis tiap jam</p>
        </div>
        <div class="live-badge">
            <span class="live-dot"></span> LIVE
        </div>
    </header>

    <main id="news-container" class="news-grid">
        <div class="status-msg">Memuat berita terbaru...</div>
    </main>

    <script>
        function cleanText(text) {
            if (!text) return '';
            return text.replace(/<[^>]*>?/gm, '').trim();
        }

        fetch('news.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('news-container');
                container.innerHTML = '';
                
                if (!data.articles || data.articles.length === 0) {
                    container.innerHTML = '<div class="status-msg">Belum ada berita tersedia. Jalankan Workflow di Actions.</div>';
                    return;
                }

                data.articles.forEach(item => {
                    const card = document.createElement('a');
                    card.className = 'news-card';
                    card.href = item.url;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';

                    const dateStr = item.pubDate 
                        ? new Date(item.pubDate).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) 
                        : '';
                    
                    const descClean = cleanText(item.description);

                    card.innerHTML = `
                        ${item.image ? `<div class="image-container"><img src="${item.image}" alt="Gambar Berita" loading="lazy"></div>` : ''}
                        <div class="news-content">
                            <div class="news-title">${cleanText(item.title)}</div>
                            ${descClean ? `<div class="news-desc">${descClean}</div>` : ''}
                            <div class="news-meta">
                                <span class="news-source">${item.source || 'BERITA'}</span>
                                <span>${dateStr}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(() => {
                document.getElementById('news-container').innerHTML = '<div class="status-msg">Gagal memuat berita.</div>';
            });
    </script>

</body>
</html>
