<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berita Terkini</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: #0d0d0d;
            color: #e5e5e5;
            padding: 24px 16px;
            max-width: 640px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 32px;
            border-bottom: 1px solid #222;
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: #888888;
        }

        .news-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .news-card {
            background: #161616;
            border: 1px solid #242424;
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .news-card:active {
            transform: scale(0.98);
            border-color: #444;
        }

        .news-card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background: #222;
            display: block;
        }

        .news-content {
            padding: 18px;
        }

        .news-title {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.4;
            color: #f1f1f1;
            margin-bottom: 10px;
        }

        .news-desc {
            font-size: 13.5px;
            color: #aaa;
            line-height: 1.5;
            margin-bottom: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-date {
            font-size: 11px;
            color: #666;
            text-align: right;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-msg {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📰 Berita Terkini</h1>
        <p>Diperbarui secara otomatis setiap jam</p>
    </div>

    <div id="news-container" class="news-grid">
        <div class="status-msg">Memuat berita...</div>
    </div>

    <script>
        fetch('news.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('news-container');
                container.innerHTML = '';
                
                if (!data.articles || data.articles.length === 0) {
                    container.innerHTML = '<div class="status-msg">Belum ada berita tersedia. Jalankan Workflow di Actions.</div>';
                    return;
                }

                data.articles.forEach(item => {
                    const card = document.createElement('a');
                    card.className = 'news-card';
                    card.href = item.url;
                    card.target = '_blank';

                    const dateStr = item.pubDate ? new Date(item.pubDate).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '';

                    card.innerHTML = `
                        ${item.image ? `<img src="${item.image}" alt="Gambar Berita">` : ''}
                        <div class="news-content">
                            <div class="news-title">${item.title}</div>
                            <div class="news-desc">${item.description || ''}</div>
                            ${dateStr ? `<div class="news-date">${dateStr}</div>` : ''}
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('news-container').innerHTML = '<div class="status-msg">Gagal memuat berita.</div>';
            });
    </script>

</body>
</html>
